name: Build and deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.CONTAINER_APP_IMAGE_NAME }}:${IMAGE_TAG}"
          docker build -f src/Dockerfile -t "$IMAGE_NAME" src
          docker push "$IMAGE_NAME"

      - name: Deploy image to Azure Container App
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.CONTAINER_APP_IMAGE_NAME }}:${IMAGE_TAG}"
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.CONTAINER_APP_RESOURCE_GROUP }}" \
            --image "$IMAGE_NAME" \
            --set-env-vars \
              FOUNDRY_ENDPOINT="${{ secrets.FOUNDRY_ENDPOINT }}" \
              gpt_endpoint="${{ secrets.gpt_endpoint }}" \
              embedding_endpoint="${{ secrets.embedding_endpoint }}" \
              phi_4_endpoint="${{ secrets.phi_4_endpoint }}"
